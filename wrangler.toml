name = "suhesh"
main = ".open-next/worker.js"
compatibility_date = "2026-05-21"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[ai]
binding = "AI"
remote = true

# Storage for the OpenNext incremental cache. Create it once with:
#   npx wrangler r2 bucket create suhesh-next-cache
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "suhesh-next-cache"
